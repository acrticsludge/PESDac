<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" font-family="sans-serif">
<rect width="400" height="220" fill="#1b1b1b"/>
<text x="200" y="24" fill="#fafafa" font-size="16" text-anchor="middle">Synchronous Sequential Circuit</text>
<g font-size="12" text-anchor="middle">
<rect x="30" y="70" width="130" height="70" rx="8" fill="#262626" stroke="#e5e5e5"/><text x="95" y="100" fill="#fafafa">Combinational</text><text x="95" y="120" fill="#a3a3a3">logic</text>
<rect x="240" y="70" width="130" height="70" rx="8" fill="#262626" stroke="#9eb7ff"/><text x="305" y="100" fill="#c7d3ff">Registers</text><text x="305" y="120" fill="#a3a3a3">D-FFs</text>
<line x1="160" y1="105" x2="240" y2="105" stroke="#e5e5e5" stroke-width="2"/>
<line x1="305" y1="140" x2="305" y2="180" stroke="#9eb7ff" stroke-width="2"/>
<line x1="305" y1="180" x2="95" y2="180" stroke="#9eb7ff" stroke-width="2"/>
<line x1="95" y1="180" x2="95" y2="140" stroke="#9eb7ff" stroke-width="2"/>
<text x="200" y="90" fill="#a3a3a3" font-size="11">next state</text>
<text x="200" y="198" fill="#9eb7ff" font-size="11">present state (feedback) + CLK</text>
</g>
</svg>
