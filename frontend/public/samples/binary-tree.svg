<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" font-family="sans-serif">
<rect width="400" height="280" fill="#1b1b1b"/>
<text x="200" y="24" fill="#fafafa" font-size="16" text-anchor="middle">Binary Tree — Traversal Order</text>
<g stroke="#e5e5e5" fill="#262626" stroke-width="2">
<line x1="200" y1="60" x2="120" y2="120"/><line x1="200" y1="60" x2="280" y2="120"/>
<line x1="120" y1="120" x2="70" y2="180"/><line x1="120" y1="120" x2="170" y2="180"/>
<line x1="280" y1="120" x2="330" y2="180"/>
<circle cx="200" cy="55" r="22"/><circle cx="120" cy="120" r="22"/><circle cx="280" cy="120" r="22"/>
<circle cx="70" cy="185" r="22"/><circle cx="170" cy="185" r="22"/><circle cx="330" cy="185" r="22"/>
</g>
<g fill="#fafafa" font-size="14" text-anchor="middle">
<text x="200" y="60">8</text><text x="120" y="125">3</text><text x="280" y="125">10</text>
<text x="70" y="190">1</text><text x="170" y="190">6</text><text x="330" y="190">14</text>
</g>
<text x="200" y="240" fill="#9fe59b" font-size="12" text-anchor="middle">Inorder: 1 → 3 → 6 → 8 → 10 → 14</text>
<text x="200" y="260" fill="#a3a3a3" font-size="11" text-anchor="middle">Left · Root · Right</text>
</svg>
