<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="sans-serif">
<rect width="400" height="250" fill="#1b1b1b"/>
<text x="200" y="24" fill="#fafafa" font-size="16" text-anchor="middle">Paging — Virtual → Physical</text>
<g font-size="12" text-anchor="middle">
<text x="90" y="55" fill="#a3a3a3">Page table</text>
<rect x="40" y="62" width="100" height="32" fill="#262626" stroke="#e5e5e5"/><text x="90" y="83" fill="#fafafa">Page 0 → F3</text>
<rect x="40" y="94" width="100" height="32" fill="#262626" stroke="#9eb7ff"/><text x="90" y="115" fill="#c7d3ff">Page 1 → F7</text>
<rect x="40" y="126" width="100" height="32" fill="#262626" stroke="#e5e5e5"/><text x="90" y="147" fill="#fafafa">Page 2 → F1</text>
<rect x="40" y="158" width="100" height="32" fill="#262626" stroke="#e5e5e5"/><text x="90" y="179" fill="#fafafa">Page 3 → F5</text>
<text x="310" y="55" fill="#a3a3a3">Frames</text>
<rect x="260" y="62" width="100" height="32" fill="#262626" stroke="#e5e5e5"/><text x="310" y="83" fill="#fafafa">F1</text>
<rect x="260" y="94" width="100" height="32" fill="#262626" stroke="#9eb7ff"/><text x="310" y="115" fill="#c7d3ff">F7 ✓</text>
<rect x="260" y="126" width="100" height="32" fill="#262626" stroke="#e5e5e5"/><text x="310" y="147" fill="#fafafa">F3</text>
<rect x="260" y="158" width="100" height="32" fill="#262626" stroke="#e5e5e5"/><text x="310" y="179" fill="#fafafa">F5</text>
<line x1="140" y1="110" x2="260" y2="110" stroke="#9eb7ff" stroke-width="2" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#9eb7ff" stroke-width="1.5"/></marker></defs>
</g>
<text x="200" y="215" fill="#fafafa" font-size="12" text-anchor="middle">VA 0x1A3F → PA = 7 × 4KB + offset</text>
<text x="200" y="235" fill="#a3a3a3" font-size="11" text-anchor="middle">No external fragmentation</text>
</svg>
