<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="sans-serif">
<rect width="400" height="340" fill="#1b1b1b"/>
<text x="200" y="24" fill="#fafafa" font-size="16" text-anchor="middle">OSI Model — 7 Layers</text>
<g font-size="12" text-anchor="middle">
<rect x="90" y="40" width="220" height="34" rx="6" fill="#262626" stroke="#e5e5e5"/><text x="200" y="61" fill="#fafafa">7 · Application</text>
<rect x="90" y="80" width="220" height="34" rx="6" fill="#262626" stroke="#e5e5e5"/><text x="200" y="101" fill="#fafafa">6 · Presentation</text>
<rect x="90" y="120" width="220" height="34" rx="6" fill="#262626" stroke="#e5e5e5"/><text x="200" y="141" fill="#fafafa">5 · Session</text>
<rect x="90" y="160" width="220" height="34" rx="6" fill="#262626" stroke="#9eb7ff"/><text x="200" y="181" fill="#c7d3ff">4 · Transport (TCP/UDP)</text>
<rect x="90" y="200" width="220" height="34" rx="6" fill="#262626" stroke="#e5e5e5"/><text x="200" y="221" fill="#fafafa">3 · Network (IP)</text>
<rect x="90" y="240" width="220" height="34" rx="6" fill="#262626" stroke="#e5e5e5"/><text x="200" y="261" fill="#fafafa">2 · Data Link</text>
<rect x="90" y="280" width="220" height="34" rx="6" fill="#262626" stroke="#e5e5e5"/><text x="200" y="301" fill="#fafafa">1 · Physical</text>
</g>
<text x="200" y="330" fill="#a3a3a3" font-size="11" text-anchor="middle">Upper layers: software · Lower layers: hardware</text>
</svg>
