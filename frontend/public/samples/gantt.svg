<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" font-family="sans-serif">
<rect width="400" height="240" fill="#1b1b1b"/>
<text x="200" y="24" fill="#fafafa" font-size="16" text-anchor="middle">Round Robin — Gantt Chart (q = 4ms)</text>
<g font-size="12" text-anchor="middle">
<rect x="40" y="50" width="80" height="36" fill="#9eb7ff3D" stroke="#9eb7ff"/><text x="80" y="73" fill="#c7d3ff">P1</text>
<rect x="120" y="50" width="80" height="36" fill="#84c9803D" stroke="#84c980"/><text x="160" y="73" fill="#9fe59b">P2</text>
<rect x="200" y="50" width="80" height="36" fill="#ffa2583D" stroke="#ffa258"/><text x="240" y="73" fill="#ffc9a2">P3</text>
<rect x="280" y="50" width="60" height="36" fill="#9eb7ff3D" stroke="#9eb7ff"/><text x="310" y="73" fill="#c7d3ff">P1</text>
<rect x="40" y="96" width="60" height="36" fill="#84c9803D" stroke="#84c980"/><text x="70" y="119" fill="#9fe59b">P2</text>
<rect x="100" y="96" width="80" height="36" fill="#ffa2583D" stroke="#ffa258"/><text x="140" y="119" fill="#ffc9a2">P3</text>
<rect x="180" y="96" width="60" height="36" fill="#f297ff3D" stroke="#f297ff"/><text x="210" y="119" fill="#fac1ff">P4</text>
</g>
<g fill="#a3a3a3" font-size="11" text-anchor="middle">
<text x="40" y="150">0</text><text x="120" y="150">4</text><text x="200" y="150">8</text><text x="280" y="150">12</text><text x="340" y="150">16</text>
<text x="100" y="150"> </text>
</g>
<text x="200" y="180" fill="#fafafa" font-size="12" text-anchor="middle">Avg waiting time = (6 + 4 + 7 + 3) / 4 = 5ms</text>
<text x="200" y="202" fill="#a3a3a3" font-size="11" text-anchor="middle">No starvation · fair CPU share</text>
</svg>
